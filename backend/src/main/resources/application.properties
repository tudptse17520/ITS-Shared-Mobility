spring.application.name=its-shared-mobility

# ==================== SQL Server Configuration ====================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==================== JPA / Hibernate Configuration ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ==================== Server Configuration ====================
server.port=${APP_PORT:8080}

# ==================== VNPAY Sandbox Configuration ====================
vnpay.tmn-code=${VNPAY_TMN_CODE:2XKCYOIK}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay-return}

# ==================== VietMap API Configuration ====================
vietmap.api-key=${VIETMAP_API_KEY:}

# ==================== Security & Demo Seed Configuration ====================
app.security.require-auth=${APP_SECURITY_REQUIRE_AUTH:true}
its.demo.seed=${ITS_DEMO_SEED:${APP_DEMO_SEED_ENABLED:false}}

# ==================== JWT Configuration ====================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

