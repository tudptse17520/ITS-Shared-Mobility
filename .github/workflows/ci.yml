name: ITS-Shared-Mobility CI

on:
  push:
    branches: [main, develop, "fix/*", "feat/*"]
  pull_request:
    branches: [main, develop]

jobs:
  web:
    name: Web Admin (TypeScript, ESLint, Next.js Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1

  backend:
    name: Backend API & Integration Tests (SQL Server 2022)
    runs-on: ubuntu-latest
    env:
      SA_PASSWORD: "ItsCi!Password2026"
      DB_NAME: "its_ci_test"
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "ItsCi!Password2026"
          MSSQL_PID: "Express"
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Wait for SQL Server and create CI test database
        run: |
          SQLCMD="/opt/mssql-tools18/bin/sqlcmd"
          if [ ! -x "$SQLCMD" ]; then
            SQLCMD="/opt/mssql-tools/bin/sqlcmd"
          fi
          for i in $(seq 1 30); do
            if "$SQLCMD" -S 127.0.0.1,1433 -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              "$SQLCMD" -S 127.0.0.1,1433 -U sa -P "$SA_PASSWORD" -C -Q "IF DB_ID('${DB_NAME}') IS NULL CREATE DATABASE [${DB_NAME}];"
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become ready in time"
          exit 1
      - name: Run Maven Test Suite
        working-directory: backend
        env:
          DB_URL: "jdbc:sqlserver://localhost:1433;databaseName=its_ci_test;encrypt=true;trustServerCertificate=true"
          DB_USERNAME: sa
          DB_PASSWORD: "ItsCi!Password2026"
          JWT_SECRET: "ci-its-shared-mobility-secret-key-minimum-32-bytes"
          VNPAY_TMN_CODE: "2XKCYOIK"
          VNPAY_HASH_SECRET: "CI_DUMMY_VNPAY_HASH_SECRET_32_BYTES"
        run: |
          chmod +x mvnw
          ./mvnw test -B

  android:
    name: Mobile Android (Unit Tests & Debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Run unit tests and build Debug APK
        env:
          API_BASE_URL: "http://10.0.2.2:8080/api/v1/"
          VIETMAP_API_KEY: ""
          MAPS_API_KEY: "MAPS_API_KEY_PLACEHOLDER"
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

